<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Robot pipeline: CAD in SOLIDWORKS, sw2sim exports a joint graph, robot assets are versioned, SimPrep Studio makes them simulation-ready, ESKISTA Studio trains and deploys.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect width="1200" height="470" rx="14" fill="#0d1117"/><rect x=".5" y=".5" width="1199" height="469" rx="14" fill="none" stroke="#30363d"/>
<text x="40" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">From CAD to a robot that moves</text>
<text x="40" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1">One pipeline, five stages. Each stage hands the next one a file format, not a screenshot.</text>
<rect x="40.0" y="110" width="196.8" height="200" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
<text x="56.0" y="138" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing=".08em" font-weight="700" fill="#9198a1">CAD</text>
<text x="56.0" y="166" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0f6fc">eskista-bot</text>
<text x="56.0" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">SOLIDWORKS assemblies of</text>
<text x="56.0" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">the robots I design.</text>
<line x1="239.8" y1="210" x2="267.8" y2="210" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="270.8" y="110" width="196.8" height="200" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="286.8" y="138" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing=".08em" font-weight="700" fill="#58a6ff">EXPORT</text>
<text x="286.8" y="166" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0f6fc">sw2sim</text>
<text x="286.8" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Joint graph authored in</text>
<text x="286.8" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">CAD. Exports MuJoCo, URDF</text>
<text x="286.8" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">and USD without dropping</text>
<text x="286.8" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">closed loops.</text>
<line x1="470.6" y1="210" x2="498.6" y2="210" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="501.6" y="110" width="196.8" height="200" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="517.6" y="138" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing=".08em" font-weight="700" fill="#e3b341">ASSETS</text>
<text x="517.6" y="166" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0f6fc">nebs-robot-assets</text>
<text x="517.6" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Robots as versioned</text>
<text x="517.6" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">packages, pinned in the</text>
<text x="517.6" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">studio as a submodule.</text>
<line x1="701.4000000000001" y1="210" x2="729.4000000000001" y2="210" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="732.4000000000001" y="110" width="196.8" height="200" rx="10" fill="#161b22" stroke="#f778ba" stroke-width="1.5"/>
<text x="748.4000000000001" y="138" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing=".08em" font-weight="700" fill="#f778ba">PREPARE</text>
<text x="748.4000000000001" y="166" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0f6fc">SimPrep Studio</text>
<text x="748.4000000000001" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Clearances, collision,</text>
<text x="748.4000000000001" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">motors and joint limits,</text>
<text x="748.4000000000001" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">in a browser, on my</text>
<text x="748.4000000000001" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">machine.</text>
<line x1="932.2" y1="210" x2="960.2" y2="210" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="963.2" y="110" width="196.8" height="200" rx="10" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
<text x="979.2" y="138" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing=".08em" font-weight="700" fill="#56d364">TRAIN + RUN</text>
<text x="979.2" y="166" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0f6fc">ESKISTA Studio</text>
<text x="979.2" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Visualize, capture motion,</text>
<text x="979.2" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">train policies in MuJoCo</text>
<text x="979.2" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">or Isaac Lab, drive</text>
<text x="979.2" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">hardware.</text>
<rect x="40" y="370" width="1120" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="60" y="398" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Why it is built this way</text>
<text x="60" y="420" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9198a1">Simulation is only useful if the model keeps every hinge and every mass. A tree flattened too early loses a four-bar linkage, so the graph stays the source of truth.</text>
</svg>