<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Two robots: EB1, an upper-body humanoid with 15 degrees of freedom, and EB2, an arm with a four-bar shoulder and a serial elbow.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect width="1200" height="360" rx="14" fill="#f6f8fa"/><rect x=".5" y=".5" width="1199" height="359" rx="14" fill="none" stroke="#d0d7de"/>
<text x="40" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">ESKISTA robots</text>
<text x="40" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#59636e">Custom robots built to perform the eskista, an Ethiopian shoulder dance.</text>
<rect x="40" y="100" width="540" height="230" rx="10" fill="#ffffff" stroke="#bf3989" stroke-width="1.5"/>
<text x="60" y="130" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing=".08em" font-weight="700" fill="#bf3989">EB1</text>
<text x="60" y="160" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Upper-body humanoid</text>
<text x="60" y="190" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">15 degrees of freedom, built for expressive motion.</text>
<rect x="60" y="226" width="150" height="72" rx="8" fill="#eaeef2" stroke="#d0d7de"/>
<text x="74" y="256" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f2328">15</text>
<text x="74" y="284" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e">Degrees of freedom</text>
<rect x="225" y="226" width="150" height="72" rx="8" fill="#eaeef2" stroke="#d0d7de"/>
<text x="239" y="256" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f2328">upper body</text>
<text x="239" y="284" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e">Form</text>
<rect x="390" y="226" width="150" height="72" rx="8" fill="#eaeef2" stroke="#d0d7de"/>
<text x="404" y="256" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f2328">package</text>
<text x="404" y="284" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e">Delivered as</text>
<rect x="620" y="100" width="540" height="230" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
<text x="640" y="130" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing=".08em" font-weight="700" fill="#0969da">EB2</text>
<text x="640" y="160" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">Arm, prepared for simulation</text>
<text x="640" y="190" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e">Four-bar parallel shoulder feeding a serial elbow chain.</text>
<line x1="700" y1="296" x2="780" y2="296" stroke="#0969da" stroke-width="3"/>
<line x1="780" y1="296" x2="812" y2="236" stroke="#0969da" stroke-width="3"/>
<line x1="812" y1="236" x2="732" y2="236" stroke="#0969da" stroke-width="3"/>
<line x1="732" y1="236" x2="700" y2="296" stroke="#0969da" stroke-width="3"/>
<line x1="812" y1="236" x2="900" y2="262" stroke="#bf3989" stroke-width="3"/><line x1="900" y1="262" x2="962" y2="232" stroke="#bf3989" stroke-width="3"/>
<circle cx="700" cy="296" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<circle cx="780" cy="296" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<circle cx="812" cy="236" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<circle cx="732" cy="236" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<circle cx="900" cy="262" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<circle cx="962" cy="232" r="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
<text x="1060" y="250" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0969da">four-bar</text>
<text x="1060" y="270" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#bf3989">+ serial elbow</text>
</svg>