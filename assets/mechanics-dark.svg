<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Two problems that break simulation: a tree that drops a hinge of a four-bar, and a collision mesh that fills a bearing bore.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect width="1200" height="420" rx="14" fill="#0d1117"/><rect x=".5" y=".5" width="1199" height="419" rx="14" fill="none" stroke="#30363d"/>
<text x="40" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">Two places simulation silently goes wrong</text>
<text x="40" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9198a1">What sw2sim and SimPrep Studio are built to stop.</text>
<text x="40" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">1 · Parallel linkages need a graph, not a tree</text>
<line x1="70" y1="260" x2="190" y2="260" stroke="#58a6ff" stroke-width="3" />
<line x1="190" y1="260" x2="220" y2="160" stroke="#58a6ff" stroke-width="3" />
<line x1="220" y1="160" x2="100" y2="160" stroke="#58a6ff" stroke-width="3" />
<line x1="100" y1="160" x2="70" y2="260" stroke="#58a6ff" stroke-width="3" />
<circle cx="70" cy="260" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="190" cy="260" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="220" cy="160" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="100" cy="160" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<text x="145" y="296" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#9198a1">authoring graph: 4 hinges kept</text>
<line x1="270" y1="205" x2="330" y2="205" stroke="#9198a1" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="300" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#9198a1">export</text>
<line x1="360" y1="260" x2="480" y2="260" stroke="#58a6ff" stroke-width="3" />
<line x1="480" y1="260" x2="510" y2="160" stroke="#58a6ff" stroke-width="3" />
<line x1="510" y1="160" x2="390" y2="160" stroke="#58a6ff" stroke-width="3" />
<line x1="390" y1="160" x2="360" y2="260" stroke="#f778ba" stroke-width="3" stroke-dasharray="7 5"/>
<circle cx="360" cy="260" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="480" cy="260" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="510" cy="160" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="390" cy="160" r="7" fill="#161b22" stroke="#f0f6fc" stroke-width="2"/>
<text x="435" y="296" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#9198a1">3 tree edges + 1 closure</text>
<text x="40" y="360" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">A tree built too early drops a hinge, and often a mass. Here the closure stays.</text>
<line x1="600" y1="100" x2="600" y2="380" stroke="#30363d"/>
<text x="640" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">2 · Collision must leave bearing bores open</text>
<rect x="640" y="160" width="200" height="120" rx="10" fill="#151b23" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="740" cy="220" r="38" fill="#ff7b72" fill-opacity="0.35" stroke="#ff7b72" stroke-width="2.5" stroke-dasharray="5 4"/>
<circle cx="740" cy="220" r="22" fill="#f0f6fc" fill-opacity=".85"/>
<text x="740" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#9198a1">convex pieces fill the bore: seized</text>
<rect x="910" y="160" width="200" height="120" rx="10" fill="#151b23" stroke="#f0f6fc" stroke-width="2"/>
<circle cx="1010" cy="220" r="38" fill="#161b22" fill-opacity="1" stroke="#56d364" stroke-width="2.5" />
<circle cx="1010" cy="220" r="22" fill="#f0f6fc" fill-opacity=".85"/>
<text x="1010" y="308" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#9198a1">clearance volume: bore stays open</text>
<text x="640" y="360" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">SimPrep Studio subtracts a clearance volume from the link before it generates collision.</text>
</svg>